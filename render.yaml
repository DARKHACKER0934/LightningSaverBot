services:
  - type: worker
    name: lightning-saver-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB
        sync: false
      - key: ZAPUPI_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: LOG_GROUP
        sync: false
      - key: FREEMIUM_LIMIT
        value: "0"
      - key: PREMIUM_LIMIT
        value: "5000"
      - key: MAX_HEAVY_JOBS
        value: "8"
      - key: ENABLE_MEDIA_LOGGING
        value: "false"
